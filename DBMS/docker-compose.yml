services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hospital-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_rag
    ports:
      - "5432:5432"
    volumes:
      - hospital_rag_data:/var/lib/postgresql/data

volumes:
  hospital_rag_data: